<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>HeatmapComponent demo 5</title>
  <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">
  <link rel="stylesheet" type="text/css" href="../build/heatmap-component.css" />
  <script src="../build/heatmap-component.js"></script>
  <style>
    #app .heatmap-canvas-div {
      inset: 0.5em 0.5em 1.5em 2.5em;
      border: solid 1px black;
    }

    #app .heatmap-axes {
      .domain {
        stroke-width: 3;
      }

      .tick line {
        stroke-width: 0.5;
      }
    }

    .heatmap-region-x,
    .heatmap-region-y {
      stroke: #00000040;
      stroke-width: 1px;
      stroke-dasharray: 3 3;
    }
  </style>
</head>

<body>
  <h1>Demo 5</h1>
  <p>This demo shows a protein-protein interface contact map</p>
  <span id="error"></span>
  <h3>
    &ensp;
    <button id="btn-previous">&lt;</button>
    <button id="btn-next">&gt;</button>
    &ensp;
    <span id="interface-number"></span>
    &ensp;
    <span id="interface-title">Interface</span>
  </h3>

  <form>
    <strong>Axes:</strong>

    <input type="radio" name="axes-kind" id="axes-full-sequence">
    <label for="axes-full-sequence" title="Show full polymer sequence on X and Y axis">Full sequence</label>

    <input type="radio" name="axes-kind" id="axes-contact-regions" checked>
    <label for="axes-contact-regions" title="Show only residues with at least one contact, plus a few surrounding residues">Only contact regions</label>

    <input type="radio" name="axes-kind" id="axes-contact-residues">
    <label for="axes-contact-residues" title="Show only residues with at least one contact">Only contact residues</label>
  </form>

  <div style="padding: 15px; background-color: white;">
    <!-- Your visualization will be placed here -->
    <div id="app" style="max-width: 800px; max-height: 600px; width: 100px; height: 100px; border: solid 1px gainsboro;"></div>
    <!-- width, height style properties on #app element are just placeholders. Real size will be set by `ensureCellAspectRatio`, based on max-width, max-height. -->
  </div>

  <p><strong>Rows:</strong> <span id="row-names"></span></p>
  <p><strong>Columns:</strong> <span id="column-names"></span></p>
  <p><strong>Maximum contact frequency:</strong> <span id="max-frequency"></span></p>

  <script>
    HeatmapComponent.demos.demo5('app');
  </script>

  <p><a href="../src/heatmap-component/demo.ts">Source code</a></p>
</body>

</html>
